# LabDesk CI — build Flatpak and publish to Ranga/flatpaks (not into this repo).
#
# Required CI/CD variables (project settings → Variables), not committed:
#   FLATPAKS_REPO_URL   default https://git.bigrangatech.com/Ranga/flatpaks.git
#   FLATPAKS_DEPLOY_TOKEN  write access to Ranga/flatpaks
# Optional (recommended — system installs need a signed remote):
#   FLATPAK_GPG_PRIVATE_KEY  ASCII-armored secret key (or File variable)
#   FLATPAK_GPG_KEY_ID       fingerprint (optional; auto-detected)
#
# See Docs/flatpak-manifest-spec.md and Docs/dev-guide.md §1.1.

stages:
  - test
  - flatpak

variables:
  SECRET_DETECTION_ENABLED: "true"
  FLATPAKS_REPO_URL: "https://git.bigrangatech.com/Ranga/flatpaks.git"
  FLATPAK_APP_ID: "com.bigrangatech.LabDesk"

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

python_import_smoke:
  stage: test
  image: python:3.12-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - python -c "import ast; ast.parse(open('src/labdesk_ui/windows/main_window.py').read())"
    - test -f flatpak/com.bigrangatech.LabDesk.yml
    - test -f Docs/flatpak-manifest-spec.md

# Build Flatpak and push the ostree repo into Ranga/flatpaks.
# Tag pipelines auto-run; default branch is manual until runners are confirmed.
flatpak_build_publish:
  stage: flatpak
  image: bilelmoussaoui/flatpak-github-actions:gnome-47
  # Prefer privileged = true on the Docker runner (helps bwrap). FUSE is
  # optional when using --disable-rofiles-fuse below; openh264 bwrap
  # warnings are usually non-fatal.
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    # Fail fast if this Docker job cannot create user namespaces (bwrap).
    - |
      if ! unshare --user --pid echo ok >/dev/null 2>&1; then
        echo "ERROR: bwrap/userns unavailable in this job."
        echo "On the runner host, under [runners.docker] for Labdesk set:"
        echo "  privileged = true"
        echo "  security_opt = [\"seccomp:unconfined\", \"apparmor:unconfined\"]"
        echo "And on Ubuntu hosts often also:"
        echo "  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0"
        exit 1
      fi
    # Manifest pins Freedesktop 24.08 + rust-stable; CI image does not ship them.
    - |
      flatpak install -y --noninteractive --user \
        org.freedesktop.Platform//24.08 \
        org.freedesktop.Sdk//24.08 \
        org.freedesktop.Sdk.Extension.rust-stable//24.08
  script:
    - |
      set -euo pipefail
      echo "Building ${FLATPAK_APP_ID}…"
      rm -rf ci-flatpak-meta
      mkdir -p ci-flatpak-meta
      GPG_ARGS=()
      if [ -n "${FLATPAK_GPG_PRIVATE_KEY:-}" ]; then
        export GNUPGHOME
        GNUPGHOME="$(mktemp -d)"
        chmod 700 "${GNUPGHOME}"
        # Support File-type CI vars (path), ASCII-armored secret, or
        # single-line base64 (required for GitLab Masked variables —
        # armored keys contain newlines and cannot be Masked).
        if [ -f "${FLATPAK_GPG_PRIVATE_KEY}" ]; then
          if grep -q "BEGIN PGP" "${FLATPAK_GPG_PRIVATE_KEY}"; then
            gpg --batch --import "${FLATPAK_GPG_PRIVATE_KEY}"
          else
            base64 -d < "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --import
          fi
        elif printf '%s' "${FLATPAK_GPG_PRIVATE_KEY}" | grep -q "BEGIN PGP"; then
          printf '%s\n' "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --import
        else
          printf '%s' "${FLATPAK_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
        fi
        KEY_ID="${FLATPAK_GPG_KEY_ID:-}"
        if [ -z "${KEY_ID}" ]; then
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
        fi
        if [ -z "${KEY_ID}" ]; then
          echo "ERROR: FLATPAK_GPG_PRIVATE_KEY imported but no key id found."
          exit 1
        fi
        echo "GPG signing with ${KEY_ID}"
        GPG_ARGS=(--gpg-sign="${KEY_ID}" --gpg-homedir="${GNUPGHOME}")
        gpg --armor --export "${KEY_ID}" > ci-flatpak-meta/bigrangatech-flatpak.gpg
        GPG_B64="$(gpg --export "${KEY_ID}" | base64 -w0)"
        REPO_URL="https://git.bigrangatech.com/Ranga/flatpaks/-/raw/main/labdesk/repo"
        {
          echo "[Flatpak Repo]"
          echo "Title=BigRanga LabDesk"
          echo "Url=${REPO_URL}"
          echo "Homepage=https://git.bigrangatech.com/Ranga/labdesk"
          echo "Comment=LabDesk Flatpak remote"
          echo "Description=Self-hosted Flatpak remote for LabDesk (BigRanga Tech)"
          echo "GPGKey=${GPG_B64}"
        } > ci-flatpak-meta/labdesk.flatpakrepo
      else
        echo "WARNING: FLATPAK_GPG_PRIVATE_KEY unset — publishing unsigned repo."
        echo "System Flatpak installs will refuse it (need --user --no-gpg-verify)."
      fi
      # --disable-rofiles-fuse: avoid /dev/fuse requirement in Docker CI
      flatpak-builder --user --force-clean --disable-rofiles-fuse \
        --install-deps-from=flathub \
        --repo=repo \
        ${GPG_ARGS[@]+"${GPG_ARGS[@]}"} \
        flatpak-build \
        flatpak/com.bigrangatech.LabDesk.yml
      if [ "${#GPG_ARGS[@]}" -gt 0 ]; then
        flatpak build-update-repo "${GPG_ARGS[@]}" repo
      else
        flatpak build-update-repo repo
      fi
    - |
      set -euo pipefail
      if [ -z "${FLATPAKS_DEPLOY_TOKEN:-}" ]; then
        echo "FLATPAKS_DEPLOY_TOKEN not set — build OK, skip publish."
        echo "Set the variable to push into Ranga/flatpaks."
        exit 0
      fi
      DEST="${FLATPAKS_REPO_URL}"
      # Public http→https redirects strip Basic credentials. Keep plain http
      # for direct LAN/origin URLs (e.g. http://192.168.0.214:8929/...).
      case "${DEST}" in
        http://127.*|http://localhost*|http://10.*|http://192.168.*|http://172.1[6-9].*|http://172.2[0-9].*|http://172.3[0-1].*)
          ;;
        http://*)
          DEST="https://${DEST#http://}"
          ;;
      esac
      case "${DEST}" in
        https://*|http://*)
          # Project/group access tokens: username oauth2 + token as password.
          # Deploy tokens: set FLATPAKS_DEPLOY_USER to the deploy-token username.
          USERNAME="${FLATPAKS_DEPLOY_USER:-oauth2}"
          AUTH_DEST=$(echo "${DEST}" | sed "s#://#://${USERNAME}:${FLATPAKS_DEPLOY_TOKEN}@#")
          ;;
        *)
          AUTH_DEST="${DEST}"
          ;;
      esac
      rm -rf /tmp/flatpaks-publish
      git clone --depth 1 "${AUTH_DEST}" /tmp/flatpaks-publish
      mkdir -p /tmp/flatpaks-publish/labdesk
      rm -rf /tmp/flatpaks-publish/labdesk/repo
      cp -a repo /tmp/flatpaks-publish/labdesk/repo
      if [ -f ci-flatpak-meta/bigrangatech-flatpak.gpg ]; then
        cp -a ci-flatpak-meta/bigrangatech-flatpak.gpg \
          /tmp/flatpaks-publish/labdesk/bigrangatech-flatpak.gpg
      fi
      if [ -f ci-flatpak-meta/labdesk.flatpakrepo ]; then
        cp -a ci-flatpak-meta/labdesk.flatpakrepo \
          /tmp/flatpaks-publish/labdesk/labdesk.flatpakrepo
      fi
      cd /tmp/flatpaks-publish
      git config user.email "ci@labdesk.local"
      git config user.name "LabDesk CI"
      git add -A labdesk/
      if git diff --cached --quiet; then
        echo "No changes to publish."
        exit 0
      fi
      git commit -m "labdesk: publish ${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      # Push to the credentialed URL directly (clone remotes often drop auth).
      echo "Publish payload size (approx):"
      du -sh labdesk/repo labdesk 2>/dev/null || true
      echo "Pushing to flatpaks (credentials redacted)…"
      # Larger buffer helps some proxies; 413 itself is still a server body-size limit.
      git config http.postBuffer 524288000
      PUSH_LOG="$(mktemp)"
      if ! git push "${AUTH_DEST}" HEAD:main 2>&1 | tee "${PUSH_LOG}"; then
        if grep -qE 'HTTP 413|413 Request Entity Too Large|requested URL returned error: 413' "${PUSH_LOG}"; then
          echo "Push failed with HTTP 413 (request entity too large)."
          echo "The Flatpak ostree repo is bigger than something on the path will accept."
          echo "This is NOT a deploy-token issue. Check, in order:"
          echo "  1. Cloudflare: Free/Pro ~100MB body limit. Grey-cloud the GitLab"
          echo "     DNS record, or push via a non-proxied host / SSH to origin."
          echo "     (Set FLATPAKS_REPO_URL to the direct hostname if needed.)"
          echo "  2. Omnibus: nginx['client_max_body_size'] = '0' then gitlab-ctl reconfigure"
          echo "  3. Any other reverse proxy: raise client_max_body_size"
          echo "  4. Admin → Settings → General → Account and limit: max push size"
          echo "Do not put ostree objects in Git LFS when serving via /-/raw/ —"
          echo "Flatpak would download LFS pointer files instead of content."
          exit 1
        fi
        echo "Push failed. Check FLATPAKS_DEPLOY_TOKEN on labdesk:"
        echo "  - Token is from Ranga/flatpaks (not labdesk)"
        echo "  - Scope includes write_repository (read-only is enough for clone, not push)"
        echo "  - Role is Developer or Maintainer (Reporter cannot push)"
        echo "  - If main is protected, token role must be allowed to push"
        echo "  - Variable not 'Protected' unless this branch/tag is protected"
        exit 1
      fi
  artifacts:
    when: on_success
    paths:
      - repo/
      - ci-flatpak-meta/
    expire_in: 7 days
