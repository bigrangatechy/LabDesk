# LabDesk CI — build Flatpak and publish to Ranga/flatpaks (not into this repo).
#
# Required CI/CD variables (project settings → Variables), not committed:
#   FLATPAKS_REPO_URL   default http://git.bigrangatech.com/Ranga/flatpaks.git
#   FLATPAKS_DEPLOY_TOKEN  write access to Ranga/flatpaks
#
# See Docs/flatpak-manifest-spec.md and Docs/dev-guide.md §1.1.

stages:
  - test
  - flatpak

variables:
  SECRET_DETECTION_ENABLED: "true"
  FLATPAKS_REPO_URL: "http://git.bigrangatech.com/Ranga/flatpaks.git"
  FLATPAK_APP_ID: "com.bigrangatech.LabDesk"

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

python_import_smoke:
  stage: test
  image: python:3.12-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - python -c "import ast; ast.parse(open('src/labdesk_ui/windows/main_window.py').read())"
    - test -f flatpak/com.bigrangatech.LabDesk.yml
    - test -f Docs/flatpak-manifest-spec.md

# Build Flatpak and push the ostree repo into Ranga/flatpaks.
# Tag pipelines auto-run; default branch is manual until runners are confirmed.
flatpak_build_publish:
  stage: flatpak
  image: bilelmoussaoui/flatpak-github-actions:gnome-47
  # Prefer privileged = true on the Docker runner (helps bwrap). FUSE is
  # optional when using --disable-rofiles-fuse below; openh264 bwrap
  # warnings are usually non-fatal.
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    # Fail fast if this Docker job cannot create user namespaces (bwrap).
    - |
      if ! unshare --user --pid echo ok >/dev/null 2>&1; then
        echo "ERROR: bwrap/userns unavailable in this job."
        echo "On the runner host, under [runners.docker] for Labdesk set:"
        echo "  privileged = true"
        echo "  security_opt = [\"seccomp:unconfined\", \"apparmor:unconfined\"]"
        echo "And on Ubuntu hosts often also:"
        echo "  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0"
        exit 1
      fi
    # Manifest pins Freedesktop 24.08 + rust-stable; CI image does not ship them.
    - |
      flatpak install -y --noninteractive --user \
        org.freedesktop.Platform//24.08 \
        org.freedesktop.Sdk//24.08 \
        org.freedesktop.Sdk.Extension.rust-stable//24.08
  script:
    - |
      set -euo pipefail
      echo "Building ${FLATPAK_APP_ID}…"
      # --disable-rofiles-fuse: avoid /dev/fuse requirement in Docker CI
      flatpak-builder --user --force-clean --disable-rofiles-fuse \
        --install-deps-from=flathub \
        --repo=repo flatpak-build \
        flatpak/com.bigrangatech.LabDesk.yml
    - |
      set -euo pipefail
      if [ -z "${FLATPAKS_DEPLOY_TOKEN:-}" ]; then
        echo "FLATPAKS_DEPLOY_TOKEN not set — build OK, skip publish."
        echo "Set the variable to push into Ranga/flatpaks."
        exit 0
      fi
      DEST="${FLATPAKS_REPO_URL}"
      case "${DEST}" in
        http://*|https://*)
          AUTH_DEST=$(echo "${DEST}" | sed "s#://#://oauth2:${FLATPAKS_DEPLOY_TOKEN}@#")
          ;;
        *)
          AUTH_DEST="${DEST}"
          ;;
      esac
      rm -rf /tmp/flatpaks-publish
      git clone --depth 1 "${AUTH_DEST}" /tmp/flatpaks-publish
      mkdir -p /tmp/flatpaks-publish/labdesk
      rsync -a --delete repo/ /tmp/flatpaks-publish/labdesk/repo/
      cd /tmp/flatpaks-publish
      git config user.email "ci@labdesk.local"
      git config user.name "LabDesk CI"
      git add -A labdesk/
      if git diff --cached --quiet; then
        echo "No changes to publish."
        exit 0
      fi
      git commit -m "labdesk: publish ${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      git push origin HEAD:main
  artifacts:
    when: on_success
    paths:
      - repo/
    expire_in: 7 days
