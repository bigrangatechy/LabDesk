# LabDesk Flatpak manifest (beta)
#
# Build artifacts must NOT be committed to labdesk. CI publishes into
# http://git.bigrangatech.com/Ranga/flatpaks.git
# See Docs/flatpak-manifest-spec.md and ADR-004.
#
# Local trial:
#   flatpak-builder --force-clean --repo=repo flatpak-build \
#     flatpak/com.bigrangatech.LabDesk.yml

app-id: com.bigrangatech.LabDesk
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: labdesk
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Session bus + Secret Service (API PAT keyring; ADR-008 / Flatpak).
  - --socket=session-bus
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  # System tray (StatusNotifier) when the host provides one.
  - --talk-name=org.kde.StatusNotifierWatcher
  # SSH remotes via libgit2 (ssh-agent); keys stay on the host agent.
  - --socket=ssh-auth
  - --filesystem=xdg-documents
  - --filesystem=home
  - --env=PYTHONUNBUFFERED=1
modules:
  # CLI git for `git lfs …` (libgit2 covers ordinary clone/fetch/push).
  - name: git
    buildsystem: simple
    build-commands:
      - ./configure --prefix=${FLATPAK_DEST} --without-tcltk
      - make -j"${FLATPAK_BUILDER_N_JOBS}" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PYTHON=YesPlease
      - make install NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PYTHON=YesPlease
    cleanup:
      - /share/man
      - /share/info
      - /libexec/git-core/git-cvs*
      - /libexec/git-core/git-svn*
      - /bin/gitk
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.49.0.tar.xz
        sha256: 618190cf590b7e9f6c11f91f23b1d267cd98c3ab33b850416d8758f8b5a85628

  # Slice N: Git LFS client (status / pull). Prebuilt official binaries.
  - name: git-lfs
    buildsystem: simple
    build-commands:
      - install -Dm755 git-lfs /app/bin/git-lfs
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz
        sha256: e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d
        strip-components: 1
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-arm64-v3.8.0.tar.gz
        sha256: ac9c8efac980bb0505ead384d087e2acb6486fd8498691a2165fa174ec6118c2
        strip-components: 1

  # Rust core (maturin) + PySide6 + Python UI tree + launcher.
  - name: labdesk-core
    buildsystem: simple
    build-options:
      # Allow crates.io / PyPI during beta builds (vendor later for Flathub).
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/labdesk-core/cargo
        # Overwritten by CI sed to YYYY.MM.DD; local builds use date fallback in scripts.
        LABDESK_VERSION: "dev"
    build-commands:
      - |
        set -euo pipefail
        if [ -f /usr/lib/sdk/rust-stable/enable.sh ]; then
          # shellcheck disable=SC1091
          . /usr/lib/sdk/rust-stable/enable.sh
        fi
      - pip3 install --prefix=/app --no-deps maturin || true
      - pip3 install --prefix=/app 'PySide6>=6.6,<6.9'
      - |
        set -euo pipefail
        # Rebuild .qm so Flatpak ships current catalogs (Slice L).
        export PATH="/app/bin:${PATH:-}"
        if command -v pyside6-lrelease >/dev/null 2>&1 || [ -x /app/bin/pyside6-lrelease ]; then
          python3 scripts/build_translations.py
        else
          echo "pyside6-lrelease missing; shipping committed .qm files"
        fi
      - |
        set -euo pipefail
        if [ -f /usr/lib/sdk/rust-stable/enable.sh ]; then
          # shellcheck disable=SC1091
          . /usr/lib/sdk/rust-stable/enable.sh
        fi
        export LABDESK_VERSION="${LABDESK_VERSION:-$(date -u +%Y.%m.%d)}"
        cd src/labdesk_core
        # Prefer maturin if available; otherwise cargo build.
        # --skip-auditwheel: Flatpak runtime already provides system libs;
        # do not try to bundle libssl into the wheel.
        if command -v maturin >/dev/null 2>&1; then
          maturin build --release --skip-auditwheel -o /tmp/wheels
          pip3 install --prefix=/app /tmp/wheels/*.whl
        else
          cargo build --release
          # cdylib name from Cargo; install best-effort for beta skeleton
          so=$(find target/release -maxdepth 1 \( -name 'liblabdesk_core.so' -o -name 'labdesk_core.so' \) | head -1 || true)
          if [ -n "${so}" ]; then
            mkdir -p /app/lib/labdesk
            install -Dm755 "${so}" /app/lib/labdesk/
          fi
        fi
      - |
        mkdir -p /app/lib/labdesk /app/bin
        # Build-date version (CI/local: LABDESK_VERSION=YYYY.MM.DD).
        VER="${LABDESK_VERSION:-$(date -u +%Y.%m.%d)}"
        printf 'VERSION = "%s"\n' "${VER}" > src/labdesk_ui/_build_version.py
        if [ -f flatpak/com.bigrangatech.LabDesk.metainfo.xml ]; then
          sed -i "s|<!-- LABDESK_RELEASE_PLACEHOLDER -->|<release version=\"${VER}\" date=\"$(date -u +%Y-%m-%d)\"/>|" \
            flatpak/com.bigrangatech.LabDesk.metainfo.xml || true
        fi
        cp -a src/labdesk_ui /app/lib/labdesk/
        # End-user guide (Help → User Guide); also under share for Flatpak path.
        if [ -f Docs/user-guide.md ]; then
          install -Dm644 Docs/user-guide.md /app/share/labdesk/user-guide.md
          install -Dm644 Docs/user-guide.md /app/lib/labdesk/labdesk_ui/docs/user-guide.md
        elif [ -f src/labdesk_ui/docs/user-guide.md ]; then
          install -Dm644 src/labdesk_ui/docs/user-guide.md /app/share/labdesk/user-guide.md
        fi
        printf '%s\n' '#!/bin/sh' \
          'SITE=$(python3 -c "import sysconfig; print(sysconfig.get_path(\"purelib\"))" 2>/dev/null || true)' \
          'export PYTHONPATH=/app/lib/labdesk:${SITE:+$SITE:}${PYTHONPATH:-}' \
          'export PATH=/app/bin:${PATH:-}' \
          'exec python3 -m labdesk_ui.main "$@"' \
          > /app/bin/labdesk
        chmod 755 /app/bin/labdesk
        # Start-menu entry + AppStream + icons (hicolor).
        install -Dm644 flatpak/com.bigrangatech.LabDesk.desktop \
          /app/share/applications/com.bigrangatech.LabDesk.desktop
        install -Dm644 flatpak/com.bigrangatech.LabDesk.metainfo.xml \
          /app/share/metainfo/com.bigrangatech.LabDesk.metainfo.xml
        # Icons from UI assets (PNG sizes) + scalable logo SVG.
        ICON_SVG=src/labdesk_ui/assets/LabDesk-logo.svg
        if [ ! -f "${ICON_SVG}" ]; then
          ICON_SVG=src/labdesk_ui/assets/com.bigrangatech.LabDesk.svg
        fi
        if [ -f "${ICON_SVG}" ]; then
          install -Dm644 "${ICON_SVG}" \
            /app/share/icons/hicolor/scalable/apps/com.bigrangatech.LabDesk.svg
        fi
        for sz in 64 128 256 512; do
          png="src/labdesk_ui/assets/com.bigrangatech.LabDesk-${sz}x${sz}.png"
          if [ -f "${png}" ]; then
            install -Dm644 "${png}" \
              "/app/share/icons/hicolor/${sz}x${sz}/apps/com.bigrangatech.LabDesk.png"
          fi
        done
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .venv
          - src/labdesk_core/target
          - flatpak-build
          - repo
          - .flatpak-builder
