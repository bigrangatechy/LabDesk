# LabDesk Flatpak manifest (beta)
#
# Build artifacts must NOT be committed to labdesk. CI publishes into
# http://git.bigrangatech.com/Ranga/flatpaks.git
# See Docs/flatpak-manifest-spec.md and ADR-004.
#
# Local trial:
#   flatpak-builder --force-clean --repo=repo flatpak-build \
#     flatpak/com.bigrangatech.LabDesk.yml

app-id: com.bigrangatech.LabDesk
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: labdesk
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-documents
  - --filesystem=home
  - --env=PYTHONUNBUFFERED=1
modules:
  # Python + PySide6 from Freedesktop SDK python; PySide may need a
  # dedicated module or pip in a later iteration. Beta skeleton builds
  # the Rust core and installs a launcher that expects the UI tree.
  - name: labdesk-core
    buildsystem: simple
    build-options:
      # Allow crates.io / PyPI during beta builds (vendor later for Flathub).
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/labdesk-core/cargo
    build-commands:
      - |
        set -euo pipefail
        if [ -f /usr/lib/sdk/rust-stable/enable.sh ]; then
          # shellcheck disable=SC1091
          . /usr/lib/sdk/rust-stable/enable.sh
        fi
      - pip3 install --prefix=/app --no-deps maturin || true
      - |
        set -euo pipefail
        if [ -f /usr/lib/sdk/rust-stable/enable.sh ]; then
          # shellcheck disable=SC1091
          . /usr/lib/sdk/rust-stable/enable.sh
        fi
        cd src/labdesk_core
        # Prefer maturin if available; otherwise cargo build.
        # --skip-auditwheel: Flatpak runtime already provides system libs;
        # do not try to bundle libssl into the wheel.
        if command -v maturin >/dev/null 2>&1; then
          maturin build --release --skip-auditwheel -o /tmp/wheels
          pip3 install --prefix=/app /tmp/wheels/*.whl
        else
          cargo build --release
          # cdylib name from Cargo; install best-effort for beta skeleton
          so=$(find target/release -maxdepth 1 \( -name 'liblabdesk_core.so' -o -name 'labdesk_core.so' \) | head -1 || true)
          if [ -n "${so}" ]; then
            mkdir -p /app/lib/labdesk
            install -Dm755 "${so}" /app/lib/labdesk/
          fi
        fi
      - |
        mkdir -p /app/lib/labdesk /app/bin
        cp -a src/labdesk_ui /app/lib/labdesk/
        printf '%s\n' '#!/bin/sh' \
          'export PYTHONPATH=/app/lib/labdesk:${PYTHONPATH:-}' \
          'exec python3 -m labdesk_ui.main "$@"' \
          > /app/bin/labdesk
        chmod 755 /app/bin/labdesk
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .venv
          - src/labdesk_core/target
          - flatpak-build
          - repo
          - .flatpak-builder
